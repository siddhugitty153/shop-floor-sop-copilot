services:
  backend:
    build: ./backend
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

